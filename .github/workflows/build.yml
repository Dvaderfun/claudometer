name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  source:
    name: Source gate
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --locked --workspace --all-targets --all-features
      - name: Privacy network allowlist
        shell: pwsh
        run: ./ci/check-privacy.ps1
      - name: Dependency source and license policy
        shell: pwsh
        run: ./ci/check-dependencies.ps1
      - name: Workflow policy
        shell: pwsh
        run: ./ci/check-workflows.ps1

  advisory-scan:
    name: RustSec and OSV
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: RustSec advisory database
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: OSV advisory database
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          license-check: true
          allow-licenses: Apache-2.0,ISC,LGPL-2.1-or-later,MIT,MPL-2.0,OpenSSL,Unicode-3.0,Unlicense

  release-build:
    name: Release build (${{ matrix.arch }})
    needs: [source, advisory-scan]
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Build immutable release artifact
        shell: pwsh
        env:
          RELEASE_PUBLIC_KEY_HEX: ${{ vars.CLAUDOMETER_RELEASE_PUBLIC_KEY_HEX }}
          RELEASE_SEQUENCE: ${{ vars.CLAUDOMETER_RELEASE_SEQUENCE }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:RELEASE_PUBLIC_KEY_HEX -cnotmatch '^[0-9a-f]{64}$') {
              throw 'CLAUDOMETER_RELEASE_PUBLIC_KEY_HEX is not provisioned.'
            }
            if ($env:RELEASE_SEQUENCE -cnotmatch '^[1-9][0-9]*$') {
              throw 'CLAUDOMETER_RELEASE_SEQUENCE is not a positive integer.'
            }
            $env:CLAUDOMETER_RELEASE_PUBLIC_KEY_HEX = $env:RELEASE_PUBLIC_KEY_HEX
            $env:CLAUDOMETER_RELEASE_SEQUENCE = $env:RELEASE_SEQUENCE
          }
          cargo build --locked --release --target ${{ matrix.target }}
      - name: Name, measure, and hash artifact
        id: artifact
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $version = $metadata.packages[0].version
          $asset = "claudometer-v$version-windows-${{ matrix.arch }}.exe"
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/claudometer.exe" "artifacts/$asset"
          ./ci/check-artifact.ps1 -Path "artifacts/$asset" -Target "${{ matrix.target }}"
          $hash = (Get-FileHash "artifacts/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$asset" | Out-File -Encoding ascii -NoNewline "artifacts/$asset.sha256"
          "asset=$asset" >> $env:GITHUB_OUTPUT
      - name: Upload tested artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claudometer-${{ matrix.arch }}
          path: |
            artifacts/${{ steps.artifact.outputs.asset }}
            artifacts/${{ steps.artifact.outputs.asset }}.sha256
          if-no-files-found: error
          retention-days: 14

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  source-gate:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  draft-release:
    name: Draft release from tested artifacts
    needs: source-gate
    runs-on: windows-2025
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download exact tested artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: claudometer-*
          path: release-assets
          merge-multiple: true
      - name: Verify version, names, and hashes
        shell: pwsh
        run: ./ci/check-release.ps1 -Tag "${{ github.ref_name }}" -AssetsPath release-assets
      - name: Create reviewable draft
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
